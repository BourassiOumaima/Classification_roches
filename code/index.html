<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificateur de Roches</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Arial', sans-serif;
        }
        #preview {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Classificateur de Roches</h1>
        <p class="text-center text-gray-600 mb-4">Chargez une image de roche pour identifier son type.</p>
        
        <div class="flex justify-center mb-4">
            <input type="file" id="imageLoader" accept="image/*" class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-full file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100"/>
        </div>
        
        <div class="flex justify-center mb-4">
            <img id="preview" class="hidden" alt="Image chargée"/>
        </div>
        
        <div class="flex justify-center mb-4">
            <button id="predictButton" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600" disabled>Prédire</button>
        </div>
        
        <div id="result" class="text-center text-gray-700"></div>
    </div>

    <script>
    const classNames = ['Basalt', 'Coal', 'Granite', 'Limestone', 'Marble', 'Quartzite', 'Sandstone'];

    let model = null;
    const resultDiv = document.getElementById('result');
    const predictButton = document.getElementById('predictButton');
    const preview = document.getElementById('preview');

    // Charger le modèle Keras TFJS (layers model)
    async function loadModel() {
        try {
            model = await tf.loadGraphModel('./rock_classifier_float32_tfjs/model.json');
            console.log('Modèle chargé avec succès');
            resultDiv.innerHTML = 'Modèle prêt !';
            predictButton.disabled = false;
        } catch (error) {
            resultDiv.innerHTML = `Erreur de chargement du modèle : ${error.message}`;
        }
    }

    window.addEventListener('load', loadModel);

    function preprocessImage(image) {
        return tf.tidy(() => {
            const img = tf.browser.fromPixels(image)
                .resizeBilinear([224, 224])
                .div(255.0)
                .expandDims(0);
            return img;
        });
    }

    document.getElementById('imageLoader').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                resultDiv.innerHTML = '';
            };
            reader.readAsDataURL(file);
        }
    });

    predictButton.addEventListener('click', async () => {
        if (!model) return;
        resultDiv.innerHTML = 'Prédiction en cours...';
        try {
            const tensor = preprocessImage(preview);
            const predictions = model.predict(tensor);
            const data = await predictions.data();
            const top3 = Array.from(data)
                .map((p, i) => ({ prob: p, index: i }))
                .sort((a, b) => b.prob - a.prob)
                .slice(0, 3);
            const resultHTML = top3
                .map(i => `${classNames[i.index]} : ${(i.prob * 100).toFixed(2)}%`)
                .join('<br>');
            resultDiv.innerHTML = `<strong>Prédictions :</strong><br>${resultHTML}`;
            tensor.dispose();
        } catch (error) {
            resultDiv.innerHTML = `Erreur : ${error.message}`;
        }
    });
</script>

</body>
</html>
